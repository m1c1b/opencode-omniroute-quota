name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Build and pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Check packaged license and entry points
        run: |
          tar -xOf dist/*.tgz package/package.json | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const pkg = JSON.parse(data);
              if (pkg.license !== "Apache-2.0") process.exit(1);
            });
          '
          tar -xOf dist/*.tgz package/LICENSE | grep -q 'Apache License'
          tar -tzf dist/*.tgz | grep -qx 'package/dist/tui.js'
          tar -tzf dist/*.tgz | grep -qx 'package/tui.js'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7
