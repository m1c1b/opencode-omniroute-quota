name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tar -xOf package/*.tgz package/package.json | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const pkg = JSON.parse(data);
              if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
                console.error("Release tag must match package.json version");
                process.exit(1);
              }
            });
          '
      - name: Publish verified archive
        run: npm publish ./package/*.tgz --access public --provenance --tag latest --registry=https://registry.npmjs.org
